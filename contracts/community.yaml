openapi: 3.1.0

info:
  title: "PlanMate 공개 커뮤니티 API 약속 (D 파트)"
  version: "0.1.0"
  description: |
    공개 여행 목록·상세 API 약속. 기준: 세부기능정의서 v33 PUB-03·04, DB설계서 v7 PUBLIC_POST, 와이어프레임 D-01·D-02.
    응답·에러·날짜 형식은 `contracts/common.yaml`을 따른다.
    - 지금 있는 API: PUB-01 공유하기·미리보기·게시, PUB-02-02 비공개 전환, PUB-02-05 제목·소개 수정,
      PUB-03 공개 여행 목록·검색·정렬, PUB-04 공개 여행 상세, PUB-05 좋아요·취소, PUB-06 북마크·내 북마크
    - PUB-02-04 내 게시글, PUB-07 내 여행으로 복제, PUB-08 댓글, PUB-09-01 신고 접수도 있다.
    - 관리자 신고 목록·처리(ADM-02)는 A의 주소다(같은 REPORT 표를 읽음).
    - PUB-09-02 관리자 비공개·해제·신고 댓글 삭제는 HTTP 주소가 아니라 A의 관리자 서비스가 부르는 D 서비스 함수다
      (PublicPostService.hideByAdmin·unhideByAdmin, PostCommentService.deleteByAdmin). 관리자 주소는 A가 만든다.
    - 게시물 사진(POST_IMAGE_URL)은 형식·크기·저장 위치가 정해지지 않아 아직 받지 않는다(항상 null → 기본 배경).
    - 좋아요·북마크·내 북마크는 로그인이 필요하다(기본 규칙 그대로, A에 따로 요청할 것 없음).

    ## 로그인 없이 쓰는 API (A 파트 SecurityConfig에 요청)
    아래 두 주소는 비회원도 부른다(PUB-03-01·04-01 "로그인 없이 가능").
    - `GET /api/community/posts`
    - `GET /api/community/posts/{postId}`
    - `GET /api/community/posts/{postId}/comments` (PUB-08-02 댓글 목록)
    로그인한 회원이 부르면 상세의 `viewer`에 내 게시물·좋아요·북마크 여부를 채운다.

    ## 공개 게시물로 보이는 조건 (PUB-03-01·04-01, 목록·상세 같음)
    IS_PUBLIC = 'Y' 이고 ADMIN_HIDDEN = 'N' 이고 원래 여행이 휴지통(TRIP.STATUS = TRASHED)에 있지 않을 때만.
    비공개 여행은 어떤 경우에도 보이지 않는다.

    ## 이 파일에서 쓰는 D 파트 에러 코드
    | 상수 | HTTP 상태 | 문구 | 기능 ID |
    |---|---|---|---|
    | PUBLIC_POST_NOT_VISIBLE | 404 | 볼 수 없는 게시물이에요. | PUB-04-01, PUB-05-01, PUB-06-01 |
    | LIKE_RESTRICTED | 403 | 이용 제한 중에는 좋아요를 누를 수 없어요. | PUB-05-01 |
    | COMMUNITY_FEATURE_RESTRICTED | 403 | 이용 제한 중에는 커뮤니티 기능을 쓸 수 없어요. | PUB-05-02, PUB-06-01 |
    | BOOKMARK_LIMIT_EXCEEDED | 409 | 북마크는 최대 200개까지 담을 수 있어요. | PUB-06-01 |
    | POST_TITLE_REQUIRED | 400 | 공개용 제목을 입력해 주세요. | PUB-01-01·03, PUB-02-05 |
    | POST_RESTRICTED | 403 | 이용 제한 중에는 게시할 수 없어요. | PUB-01-01·02·03 |
    | POST_OWNER_ONLY | 403 | 여행 소유자만 공개할 수 있어요. | PUB-01-01·02·03 |
    | POST_ALREADY_PUBLIC | 409 | 이미 공개한 여행이에요. | PUB-01-03 |
    | POST_TRIP_TRASHED | 409 | 휴지통에 있는 여행은 게시할 수 없어요. | PUB-01-02·03 |
    | POST_ADMIN_HIDDEN | 403 | 관리자가 비공개로 바꾼 게시물이라 다시 공유할 수 없어요. | PUB-01-03, PUB-02-03 |
    | COMMENT_RESTRICTED | 403 | 이용 제한 중에는 댓글을 쓸 수 없어요. | PUB-08-01 |
    | COMMENT_EDIT_RESTRICTED | 403 | 이용 제한 중에는 댓글을 고칠 수 없어요. | PUB-08-03 |
    | COMMENT_TOO_FAST | 429 | 잠시 후 다시 등록해 주세요. (Retry-After 헤더에 남은 초) | PUB-08-01 |
    | COMMENT_EDIT_FORBIDDEN | 403 | 내가 쓴 댓글만 고칠 수 있어요. | PUB-08-03 |
    | COMMENT_DELETE_FORBIDDEN | 403 | 내가 쓴 댓글만 지울 수 있어요. | PUB-08-04 |
    | CLONE_RESTRICTED | 403 | 이용 제한 중에는 복제할 수 없어요. | PUB-07-01·02 |
    | REPORT_DUPLICATE | 409 | 이미 접수된 신고예요. | PUB-09-01 |

servers:
  - url: http://localhost:8080
    description: "로컬 개발 (VITE_API_BASE_URL과 같은 값)"

tags:
  - name: community
    description: "공개 커뮤니티 (PUB)"

paths:
  /api/community/posts:
    get:
      tags: [community]
      operationId: getPublicPosts
      summary: "PUB-03-01·02·03 공개 여행 목록·검색·정렬"
      description: |
        공개 여행 카드 목록을 10개씩 돌려준다(무한 스크롤).
        - 다음 10개: 화면이 지금까지 받은 마지막 카드의 `postId`를 `after`로 보낸다.
          서버는 그 게시물의 정렬 값(처음 게시 시각·좋아요 수) 다음부터 이어서 준다.
          그 사이 새 게시물이 생겨도 같은 카드가 두 번 나오지 않는다(PUB-03-01).
        - 첫 10개(처음·검색·정렬 바꿈·초기화)는 `after` 없이 부른다.
        - `after`로 보낸 게시물이 없으면(영구 삭제 등) 400 INVALID_INPUT. 처음부터 다시 주면 같은 카드가 겹칠 수 있어서다.
        - `page`는 화면이 몇 번째로 불렀는지(0부터) 보내는 값이고, 서버는 응답에 그대로 돌려준다(위치 계산에는 쓰지 않음).
        - `totalElements`는 지금 조건에 맞는 전체 게시물 수다. 화면 "검색 결과 n개"에 쓴다.
        - 정렬: LATEST(최신순) = 처음 게시 시각(PUBLISHED_AT) 늦은 순, 제목·소개를 고쳐도 순서 그대로.
          LIKES(좋아요순) = 좋아요 수(LIKE_COUNT) 많은 순, 같으면 늦게 게시한 순(PUB-03-03).
          처음 게시 시각까지 같으면 postId 큰 순.
        - 검색(PUB-03-02): 조건끼리는 모두 만족(그리고).
          - `q`: 제목 일부 일치, 대소문자 구분 안 함, `%`·`_`는 글자 그대로 찾음. 앞뒤 공백 제거 후 비면 검색어 없음.
          - `cityId`: 원래 여행의 도시. `days`: 원래 여행 일수(시작일~종료일, 1~7).
        - 결과가 없으면 `content`가 빈 배열(화면 문구: 조건 없음 "아직 공개된 여행이 없어요." / 조건 있음 "조건에 맞는 여행이 없어요.").
        권한: 모든 사용자(비회원 포함).
      parameters:
        - name: sort
          in: query
          required: false
          description: "정렬. 없으면 LATEST"
          schema:
            type: string
            enum: [LATEST, LIKES]
            default: LATEST
        - name: q
          in: query
          required: false
          description: "제목 검색어 0~50자"
          schema:
            type: string
            maxLength: 50
          example: "도쿄"
        - name: cityId
          in: query
          required: false
          description: "도시 ID. 없으면 전체 도시"
          schema:
            $ref: './common.yaml#/components/schemas/Id'
        - name: days
          in: query
          required: false
          description: "여행 일수 1~7. 없으면 전체"
          schema:
            type: integer
            minimum: 1
            maximum: 7
        - name: after
          in: query
          required: false
          description: "지금까지 받은 마지막 카드의 postId. 없으면 첫 10개. 없는 게시물이면 400 INVALID_INPUT"
          schema:
            $ref: './common.yaml#/components/schemas/Id'
        - name: page
          in: query
          required: false
          description: "몇 번째 요청인지(0부터). 서버는 응답 page에 그대로 돌려준다"
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: "공개 여행 카드 목록 (한 번에 10개)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: './common.yaml#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              content:
                                type: array
                                maxItems: 10
                                items:
                                  $ref: '#/components/schemas/PostListResponse'
              examples:
                OK:
                  value:
                    success: true
                    data:
                      content:
                        - postId: 12
                          title: "도쿄 3박 4일 가족여행 — 아이랑 걷기 좋은 코스"
                          imageUrl: null
                          cityName: "도쿄"
                          days: 4
                          authorNickname: "지은"
                          likeCount: 12
                          publishedAt: "2026-10-20T10:00:00"
                          updatedAt: "2026-10-28T14:05:00"
                      page: 0
                      size: 10
                      totalElements: 24
                      totalPages: 3
                      hasNext: true
                    message: null
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'

  /api/community/posts/{postId}:
    get:
      tags: [community]
      operationId: getPublicPostDetail
      summary: "PUB-04-01·03 공개 여행 상세"
      description: |
        공개 여행의 소개와 N일차별 일정을 돌려준다.
        - 일정은 따로 복사해 두지 않고, 원래 여행의 현재 일정에서 공개 허용 값만 서버가 골라 보낸다(화면에서 가리는 방식이 아님).
          - 보냄: N일차별 장소·순서·방문시간~종료시간·체류시간·카테고리·좌표(지도 핀), 다음 장소까지 이동수단·이동시간·거리·대중교통 안내(노선·환승·도보 구간), 숙소 포함
          - 보내지 않음: 실제 날짜, 경비, 참여자, 메모, 집<->공항, 고정 상태, 구간 요금, 날씨
        - 시간은 여행 도시의 현지 시각 그대로("HH:mm", 시간대 변환 없음). 화면이 12시간제로 바꾼다.
        - 보이는 조건(info 참고)에 맞지 않거나 없는 게시물이면 404 PUBLIC_POST_NOT_VISIBLE.
        - `viewer`: 로그인한 회원이면 내 게시물·좋아요·북마크·커뮤니티 쓰기 가능 여부(PUB-04-03 버튼 표시용). 비회원이면 모두 false.
        - 구간 정보(segmentToNext)의 모양은 C 파트 구간 표시(RTE-02-02)와 맞춰야 한다. TODO(C와 맞추기)
        권한: 모든 사용자(비회원 포함).
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: "공개 여행 상세"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostDetailResponse'
              examples:
                OK:
                  value:
                    success: true
                    data:
                      postId: 12
                      title: "도쿄 3박 4일 가족여행 — 아이랑 걷기 좋은 코스"
                      intro: "아이와 함께 걷기 좋은 코스로 짰어요. 오전엔 관광, 오후엔 공원 위주예요."
                      imageUrl: null
                      cityName: "도쿄"
                      mapProvider: "GOOGLE"
                      days: 4
                      authorNickname: "지은"
                      likeCount: 12
                      publishedAt: "2026-10-20T10:00:00"
                      updatedAt: "2026-10-28T14:05:00"
                      viewer:
                        loggedIn: true
                        mine: false
                        liked: false
                        bookmarked: false
                        communityWritable: true
                      schedule:
                        - dayNo: 1
                          places:
                            - order: 1
                              name: "센소지"
                              category: "관광"
                              startTime: "10:00"
                              endTime: "11:30"
                              stayMinutes: 90
                              lodging: false
                              lat: 35.7148
                              lng: 139.7967
                              segmentToNext:
                                mode: "TRANSIT"
                                durationMinutes: 15
                                estimated: true
                                distanceMeters: 3200
                                transitSummary: "지하철 긴자선 → 도보, 환승 0회"
                                walkSummary: "도보 구간 6분 · 450m"
                            - order: 2
                              name: "카페 A"
                              category: "카페"
                              startTime: "11:45"
                              endTime: "12:30"
                              stayMinutes: 45
                              lodging: false
                              lat: 35.7101
                              lng: 139.8107
                              segmentToNext: null
                    message: null
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          description: "볼 수 없는 게시물 (비공개·관리자 숨김·원래 여행 휴지통·없는 게시물)"
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
              examples:
                PUBLIC_POST_NOT_VISIBLE:
                  value:
                    success: false
                    data:
                      code: "PUBLIC_POST_NOT_VISIBLE"
                      fieldErrors: []
                    message: "볼 수 없는 게시물이에요."

  /api/community/posts/{postId}/like:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Id'
    put:
      tags: [community]
      operationId: likePost
      summary: "PUB-05-01 좋아요"
      description: |
        회원당 게시물 하나에 좋아요 하나. 이미 눌렀으면 그대로 성공(좋아요 수 안 오름). 빠르게 여러 번 눌러도 1만 오른다.
        대상은 공개 게시물만(볼 수 있는 조건은 info 참고). 내 게시물에도 할 수 있다.
        화면은 먼저 채우고 +1 한 뒤, 실패하면 되돌리고 "좋아요를 누르지 못했어요."(서버 문구가 있으면 그 문구).
        권한: 로그인한 정상 회원(이용 제한 회원 불가).
      responses:
        '200':
          description: "좋아요 한 상태와 게시물 좋아요 수"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LikeResponse'
              examples:
                OK:
                  value: { success: true, data: { liked: true, likeCount: 13 }, message: null }
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          description: "이용 제한 (LIKE_RESTRICTED)"
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
              examples:
                LIKE_RESTRICTED:
                  value: { success: false, data: { code: "LIKE_RESTRICTED", fieldErrors: [] }, message: "이용 제한 중에는 좋아요를 누를 수 없어요." }
        '404':
          $ref: '#/components/responses/PostNotVisible'
    delete:
      tags: [community]
      operationId: unlikePost
      summary: "PUB-05-02 좋아요 취소"
      description: |
        좋아요가 없으면 그대로 성공(좋아요 수 안 바뀜). 좋아요 수는 0 아래로 내려가지 않는다.
        취소는 게시물이 지금 보이는지 따지지 않는다(게시물이 아예 없으면 404).
        화면은 먼저 비우고 -1 한 뒤, 실패하면 되돌리고 "좋아요를 취소하지 못했어요."
        권한: 로그인한 정상 회원(이용 제한 회원 불가).
      responses:
        '200':
          description: "좋아요 안 한 상태와 게시물 좋아요 수"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LikeResponse'
              examples:
                OK:
                  value: { success: true, data: { liked: false, likeCount: 12 }, message: null }
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CommunityFeatureRestricted'
        '404':
          $ref: '#/components/responses/PostNotVisible'

  /api/community/posts/{postId}/bookmark:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Id'
    put:
      tags: [community]
      operationId: bookmarkPost
      summary: "PUB-06-01 북마크 저장"
      description: |
        공개 게시물만 담는다. 같은 게시물은 1개(이미 담았으면 그대로 성공). 회원당 최대 200개.
        화면: 처리 중 잠금 → 성공하면 책갈피 채움 + "북마크 완료"(3초), 실패하면 "북마크에 담지 못했어요."(서버 문구가 있으면 그 문구).
        권한: 로그인한 정상 회원(이용 제한 회원 불가).
      responses:
        '200':
          description: "담은 상태"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BookmarkResponse'
              examples:
                OK:
                  value: { success: true, data: { bookmarked: true }, message: null }
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CommunityFeatureRestricted'
        '404':
          $ref: '#/components/responses/PostNotVisible'
        '409':
          description: "200개 초과 (BOOKMARK_LIMIT_EXCEEDED)"
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
              examples:
                BOOKMARK_LIMIT_EXCEEDED:
                  value: { success: false, data: { code: "BOOKMARK_LIMIT_EXCEEDED", fieldErrors: [] }, message: "북마크는 최대 200개까지 담을 수 있어요." }
    delete:
      tags: [community]
      operationId: unbookmarkPost
      summary: "PUB-06-01 북마크 해제"
      description: |
        없으면 그대로 성공. 원래 게시물·좋아요 수는 바뀌지 않는다. 볼 수 없게 된 게시물도 해제할 수 있다(PUB-06-02).
        화면: 성공하면 "북마크에서 뺐어요"(3초).
        권한: 로그인한 정상 회원(이용 제한 회원 불가).
      responses:
        '200':
          description: "해제한 상태"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BookmarkResponse'
              examples:
                OK:
                  value: { success: true, data: { bookmarked: false }, message: null }
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CommunityFeatureRestricted'

  /api/community/bookmarks:
    get:
      tags: [community]
      operationId: getMyBookmarks
      summary: "PUB-06-02 내 북마크 목록"
      description: |
        내가 담은 공개 게시물. 담은 시각 최신순 20개씩, 다음 20개는 마지막 카드의 `bookmarkId`를 `after`로 보낸다.
        비공개·관리자 숨김·원래 여행 휴지통이 된 게시물은 카드만 남기고 내용 없이 보낸다(visible = false, post = null → 화면 "볼 수 없는 게시물").
        `totalElements`는 내 북마크 전체 수. `after`가 없거나 내 북마크가 아니면 400 INVALID_INPUT.
        권한: 로그인 회원 본인(이용 제한 회원도 볼 수 있음).
      parameters:
        - name: after
          in: query
          required: false
          description: "지금까지 받은 마지막 카드의 bookmarkId. 없으면 첫 20개"
          schema:
            $ref: './common.yaml#/components/schemas/Id'
        - name: page
          in: query
          required: false
          description: "몇 번째 요청인지(0부터). 서버는 응답 page에 그대로 돌려준다"
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: "내 북마크 (한 번에 20개)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: './common.yaml#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              content:
                                type: array
                                maxItems: 20
                                items:
                                  $ref: '#/components/schemas/MyBookmarkResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /api/trips/{tripId}/post:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Id'
    get:
      tags: [community]
      operationId: getShareStatus
      summary: "PUB-01-01 공유하기 상태 (버튼·입력 칸)"
      description: |
        여행 화면 공유하기 아이콘의 상태와 공개 정보 창에 넣을 값.
        - NONE: 처음 공유 → 두 칸 모두 빈칸 / PUBLIC: 공개 중 → 공유하기 비활성
        - PRIVATE: 소유자가 비공개로 바꿈 → 예전 공개용 제목·소개를 넣어 다시 공유
        - ADMIN_HIDDEN: 관리자 비공개 → 누르면 "관리자가 비공개로 바꾼 게시물이라 다시 공유할 수 없어요."
        권한: 여행 소유자(아니면 POST_OWNER_ONLY 403). 휴지통 여행이면 404.
      responses:
        '200':
          description: "게시 상태"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostShareStatusResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    post:
      tags: [community]
      operationId: publishPost
      summary: "PUB-01-03 게시"
      description: |
        미리보기한 공개용 제목·소개를 저장해 커뮤니티에 올린다. 공개 일정은 복사하지 않고 원래 여행의 현재 일정을 보여 준다.
        - 여행당 게시물 1개. 공개 중이면 POST_ALREADY_PUBLIC(409), 관리자 비공개면 POST_ADMIN_HIDDEN(403).
        - 비공개로 바꾼 게시물이 있으면 그 게시물을 다시 공개(좋아요·댓글 유지, 처음 게시 시각 그대로, 수정 시각 기록).
        - 같은 requestKey는 한 번만 처리(두 번 눌러도 게시물 1개, 같은 postId를 돌려줌).
        - 제목·소개 규칙은 PostCreateRequest. 휴지통 여행이면 POST_TRIP_TRASHED(409).
        - TODO(B에 요청): 방문 일정이 없으면 "일정을 추가한 뒤 공유할 수 있어요."로 막는 검사는 B의 시간표 조회가 생기면 더한다.
        화면: 확인 창 "다른 회원이 이 일정을 보고 복제할 수 있어요. 게시할까요?" → "게시 완료" → 이 게시물 상세로 이동.
        권한: 여행 소유자(이용 제한 회원 불가 POST_RESTRICTED 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '200':
          description: "게시한 게시물 ID"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [postId]
                        properties:
                          postId:
                            $ref: './common.yaml#/components/schemas/Id'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /api/trips/{tripId}/post-preview:
    get:
      tags: [community]
      operationId: getPostPreview
      summary: "PUB-01-02 공개 미리보기"
      description: |
        원래 여행의 현재 일정에서 공개 허용 값만 서버가 골라 준다(화면에서 가리는 방식이 아님). 열기만 해서는 저장하지 않는다.
        공개용 제목·소개는 저장 전이라 화면이 들고 있다. 실제 날짜·경비·참여자·메모·집<->공항·고정 상태·AI 조건·구간 요금은 칸이 없다.
        TODO(B에 요청): schedule(저장된 시간표)·cityName·mapProvider, TODO(A에 요청): authorNickname은 아직 null·빈 배열.
        권한: 여행 소유자(이용 제한 회원 불가), 휴지통 여행이면 POST_TRIP_TRASHED(409).
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: "공개될 내용"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostPreviewResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /api/community/my-posts:
    get:
      tags: [community]
      operationId: getMyPosts
      summary: "PUB-02-04 내 게시글 목록"
      description: |
        내가 작성자인 게시물(공유한 적 있는 것, 원래 여행이 휴지통이면 제외).
        정렬: 게시·수정 시각 최신순(고쳤으면 수정 시각, 아니면 처음 게시 시각), 같으면 postId 큰 순. 10개씩.
        다음 10개는 마지막 카드의 postId를 `after`로 보낸다(내 게시물이 아니거나 없으면 400 INVALID_INPUT).
        카드 버튼: PUBLIC → [비공개 전환](PATCH .../private), PRIVATE → [공개 전환](tripId의 공유하기 흐름), ADMIN_HIDDEN → 버튼 없음.
        이용 제한 회원도 목록은 볼 수 있고, communityWritable = false면 버튼을 비활성으로 보여 준다.
        권한: 로그인 회원 본인.
      parameters:
        - name: after
          in: query
          required: false
          description: "지금까지 받은 마지막 카드의 postId. 없으면 첫 10개"
          schema:
            $ref: './common.yaml#/components/schemas/Id'
        - name: page
          in: query
          required: false
          description: "몇 번째 요청인지(0부터). 서버는 응답 page에 그대로 돌려준다"
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: "내 게시글 (한 번에 10개)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: './common.yaml#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              content:
                                type: array
                                maxItems: 10
                                items:
                                  $ref: '#/components/schemas/MyPostResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'

  /api/community/posts/{postId}/comments:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Id'
    get:
      tags: [community]
      operationId: getComments
      summary: "PUB-08-02 공개 댓글 목록"
      description: |
        작성 시각 오래된 순 20개. 다음 20개는 마지막 댓글의 commentId를 `after`로 보낸다(이 게시물 댓글이 아니거나 없으면 400 INVALID_INPUT).
        볼 수 없는 게시물이면 404 PUBLIC_POST_NOT_VISIBLE(댓글도 보이지 않음). 관리자가 지운 댓글은 누구에게도 보이지 않는다.
        로그인 회원이면 본인 댓글에 mine = true([···] [수정] [삭제]).
        권한: 모든 사용자(비회원 포함) — 로그인 없이 열 주소(A에 요청).
      parameters:
        - name: after
          in: query
          required: false
          schema:
            $ref: './common.yaml#/components/schemas/Id'
        - name: page
          in: query
          required: false
          description: "몇 번째 요청인지(0부터). 서버는 응답 page에 그대로 돌려준다"
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: "댓글 (한 번에 20개, totalElements는 이 게시물 댓글 수)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: './common.yaml#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              content:
                                type: array
                                maxItems: 20
                                items:
                                  $ref: '#/components/schemas/CommentResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/PostNotVisible'
    post:
      tags: [community]
      operationId: writeComment
      summary: "PUB-08-01 공개 댓글 작성"
      description: |
        공개 게시물에만. 내용 규칙은 CommentRequest. 같은 회원은 10초에 1개(429 COMMENT_TOO_FAST, Retry-After 헤더에 남은 초).
        성공하면 게시물 작성자에게 새 댓글 알림(PUB-08-05, 본인 게시물에 본인 댓글이면 없음, 알림 저장 실패는 댓글에 영향 없음).
        TODO(A에 요청): 알림 저장(NotificationService)·작성자 닉네임은 A 함수가 생기면 연결한다.
        권한: 로그인한 정상 회원(이용 제한 COMMENT_RESTRICTED 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: "등록된 댓글 (목록 맨 아래에 추가)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommentResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostNotVisible'
        '429':
          description: "10초 안에 다시 등록 (COMMENT_TOO_FAST)"
          headers:
            Retry-After:
              description: "다시 등록할 수 있을 때까지 남은 초"
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /api/community/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema:
          $ref: './common.yaml#/components/schemas/Id'
    put:
      tags: [community]
      operationId: editComment
      summary: "PUB-08-03 본인 댓글 수정"
      description: |
        본인 댓글만(아니면 COMMENT_EDIT_FORBIDDEN 403). 볼 수 없는 게시물의 댓글은 404 PUBLIC_POST_NOT_VISIBLE.
        이미 지워진 댓글이면 404 RESOURCE_NOT_ACCESSIBLE. 고치면 edited = true("수정됨").
        권한: 로그인한 정상 회원(이용 제한 COMMENT_EDIT_RESTRICTED 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: "고친 댓글"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommentResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
    delete:
      tags: [community]
      operationId: deleteComment
      summary: "PUB-08-04 본인 댓글 삭제"
      description: |
        본인 댓글만(게시물 작성자도 남의 댓글은 불가, COMMENT_DELETE_FORBIDDEN 403). 되돌릴 수 없다. 응답 data는 null.
        게시물이 지금 보이는지는 따지지 않는다. 이미 지워졌으면 404 RESOURCE_NOT_ACCESSIBLE.
        권한: 로그인한 정상 회원(이용 제한 COMMUNITY_FEATURE_RESTRICTED 403).
      responses:
        '200':
          description: "삭제됨 (data null)"
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /api/community/posts/{postId}/clone-check:
    get:
      tags: [community]
      operationId: checkClonable
      summary: "PUB-07-01 복제 창 열기 (내 여행 n/3)"
      description: |
        게시물이 지금 보이는지 확인하고, 복제 창 위쪽 "내 여행 n/3"을 준다(B의 TRP-01-01 생성 가능 확인과 같음).
        이미 3개면 409 TRIP_LIMIT_EXCEEDED(B 문구) → 화면은 창 안에 문구를 보여 주고 [복제]를 끈다.
        권한: 로그인한 정상 회원(이용 제한 CLONE_RESTRICTED 403).
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: "복제할 수 있음"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CloneCheckResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostNotVisible'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /api/community/posts/{postId}/clone:
    post:
      tags: [community]
      operationId: cloneToMyTrip
      summary: "PUB-07-02 내 여행으로 복제"
      description: |
        공개 일정을 복제용 데이터로 정리해 B의 공통 여행 생성(TRP-01-03)으로 새 비공개 여행을 만든다. 복제한 회원이 소유자.
        - 제목 = 공개용 제목, 도시 = 공개본 도시, 종료일 = 시작일 + 공개본 일수 - 1 (화면에서 고르지 않음)
        - 날짜 범위(여행지 오늘 ~ 1년 후)·3개 제한은 B가 검사하고 B 문구 그대로 나간다(TRIP_START_DATE_OUT_OF_RANGE, TRIP_LIMIT_EXCEEDED 등).
        - 같은 requestKey는 한 번만 처리(두 번 눌러도 여행 1개, 같은 tripId). 중간에 실패하면 새 여행도 만들어지지 않는다.
        - 복제 원본 게시물 ID는 저장하지 않는다(11/23 결정). 복제 수도 세지 않는다.
        - TODO(B에 요청): 원래 여행 도시 ID·기본 이동수단(여행 기본 정보), 시간표 읽기·공동 후보 추가·일정 저장.
          TODO(C에 요청): 새 여행 구간 경로 조회. 그 전까지는 서버가 이 요청을 끝까지 처리하지 못한다.
        화면: "복제 중..." → "복제 완료" → 새 여행 일정 화면으로 이동, 재확인 안내 띠(PUB-07-03)는 B 화면이 한 번 보여 준다.
        권한: 로그인한 정상 회원(이용 제한 CLONE_RESTRICTED 403).
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneRequest'
      responses:
        '200':
          description: "새로 만든 내 여행"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tripId]
                        properties:
                          tripId:
                            $ref: './common.yaml#/components/schemas/Id'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostNotVisible'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /api/community/posts/{postId}/reports:
    post:
      tags: [community]
      operationId: reportPost
      summary: "PUB-09-01 게시물 신고 접수"
      description: |
        사유를 골라 신고한다(상태 '접수' → A의 관리자 신고 목록). 신고 수만으로 자동 숨김 없음.
        - 대상이 없거나 볼 수 없으면 404 RESOURCE_NOT_ACCESSIBLE "이미 삭제되었거나 볼 수 없는 내용이에요."
        - 처리 전(접수)에 같은 회원이 같은 대상을 다시 신고하면 409 REPORT_DUPLICATE. 관리자가 기각(처리 완료)한 뒤에는 다시 가능.
        - 내 게시물은 신고할 수 없다(화면은 [신고] 숨김, 서버는 400 INVALID_INPUT).
        화면: [신고] → "신고 중..." → "신고 접수 완료"(3초), 실패 "신고하지 못했어요. 다시 시도해 주세요."
        권한: 로그인한 정상 회원(이용 제한 COMMUNITY_FEATURE_RESTRICTED 403).
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: "접수됨"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [reportId]
                        properties:
                          reportId:
                            $ref: './common.yaml#/components/schemas/Id'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /api/community/comments/{commentId}/reports:
    post:
      tags: [community]
      operationId: reportComment
      summary: "PUB-09-01 댓글 신고 접수"
      description: |
        사유를 골라 신고한다(상태 '접수' → A의 관리자 신고 목록). 신고 수만으로 자동 숨김 없음.
        - 대상이 없거나 볼 수 없으면 404 RESOURCE_NOT_ACCESSIBLE "이미 삭제되었거나 볼 수 없는 내용이에요." (댓글이 달린 게시물이 볼 수 없어도 같음)
        - 처리 전(접수)에 같은 회원이 같은 대상을 다시 신고하면 409 REPORT_DUPLICATE. 관리자가 기각(처리 완료)한 뒤에는 다시 가능.
        - 내 댓글은 신고할 수 없다(화면은 [신고] 숨김, 서버는 400 INVALID_INPUT).
        화면: [신고] → "신고 중..." → "신고 접수 완료"(3초), 실패 "신고하지 못했어요. 다시 시도해 주세요."
        권한: 로그인한 정상 회원(이용 제한 COMMUNITY_FEATURE_RESTRICTED 403).
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: "접수됨"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [reportId]
                        properties:
                          reportId:
                            $ref: './common.yaml#/components/schemas/Id'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

  /api/community/posts/{postId}/info:
    put:
      tags: [community]
      operationId: updatePostInfo
      summary: "PUB-02-05 공개용 제목·소개 수정"
      description: |
        공개 중인 게시물의 제목·소개만 고친다(일정·좋아요·처음 게시 시각은 그대로). 저장하면 수정 시각이 바뀐다.
        공개 중이 아니면(비공개·관리자 숨김) 404 PUBLIC_POST_NOT_VISIBLE. 응답은 고친 뒤의 공개 상세.
        권한: 여행 소유자(아니면 EDIT_PERMISSION_DENIED 403), 이용 제한 회원 불가(COMMUNITY_FEATURE_RESTRICTED 403).
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateRequest'
      responses:
        '200':
          description: "고친 뒤의 공개 상세"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostDetailResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostNotVisible'

  /api/community/posts/{postId}/private:
    patch:
      tags: [community]
      operationId: makePostPrivate
      summary: "PUB-02-02 비공개 전환"
      description: |
        IS_PUBLIC = N. 원래 여행·좋아요·댓글·북마크는 그대로, 이미 복제된 여행도 그대로. 관리자 숨김이어도 할 수 있고, 이미 비공개면 그대로 성공.
        응답 data는 null. 화면: 확인 창 "북마크한 회원도 볼 수 없게 돼요. 이미 복제된 여행은 남아요." → "비공개 전환 완료" → 내 게시글로 이동.
        권한: 여행 소유자(아니면 EDIT_PERMISSION_DENIED 403), 이용 제한 회원 불가(COMMUNITY_FEATURE_RESTRICTED 403).
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: "비공개로 바뀜 (data null)"
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostNotVisible'

components:
  responses:
    PostNotVisible:
      description: "볼 수 없는 게시물 (비공개·관리자 숨김·원래 여행 휴지통·없는 게시물)"
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ErrorResponse'
          examples:
            PUBLIC_POST_NOT_VISIBLE:
              value: { success: false, data: { code: "PUBLIC_POST_NOT_VISIBLE", fieldErrors: [] }, message: "볼 수 없는 게시물이에요." }
    CommunityFeatureRestricted:
      description: "이용 제한 (COMMUNITY_FEATURE_RESTRICTED)"
      content:
        application/json:
          schema:
            $ref: './common.yaml#/components/schemas/ErrorResponse'
          examples:
            COMMUNITY_FEATURE_RESTRICTED:
              value: { success: false, data: { code: "COMMUNITY_FEATURE_RESTRICTED", fieldErrors: [] }, message: "이용 제한 중에는 커뮤니티 기능을 쓸 수 없어요." }

  schemas:
    PostListResponse:
      type: object
      description: "공개 목록 카드 한 개 (PUB-03-01). 카드: 사진 / 제목(최대 2줄) / \"도쿄 · 3일\" / \"지은 · 좋아요 12 · 수정 10.28\""
      required: [postId, title, imageUrl, cityName, days, authorNickname, likeCount, publishedAt, updatedAt]
      properties:
        postId:
          $ref: './common.yaml#/components/schemas/Id'
        title:
          type: string
          maxLength: 40
          description: "공개용 제목 (PUBLIC_POST.POST_TITLE)"
        imageUrl:
          type: [string, 'null']
          description: "대표 사진 (POST_IMAGE_URL). null이면 화면이 기본 배경을 보여 준다"
        cityName:
          type: string
          description: "원래 여행 도시 이름 (CITY.NAME_KO)"
        days:
          type: integer
          minimum: 1
          maximum: 7
          description: "원래 여행 일수"
        authorNickname:
          type: [string, 'null']
          description: "작성자 닉네임. 작성자 정보가 없으면 null"
        likeCount:
          type: integer
          minimum: 0
        publishedAt:
          $ref: './common.yaml#/components/schemas/LocalDateTime'
        updatedAt:
          description: "제목·소개·사진을 고친 시각 (PUB-02-05). 고친 적 없으면 null"
          oneOf:
            - $ref: './common.yaml#/components/schemas/LocalDateTime'
            - type: 'null'

    PostDetailResponse:
      type: object
      description: "공개 여행 상세 (PUB-04-01). 공개 허용 값만 들어 있다"
      required: [postId, title, intro, imageUrl, cityName, mapProvider, days, authorNickname, likeCount, publishedAt, updatedAt, viewer, schedule]
      properties:
        postId:
          $ref: './common.yaml#/components/schemas/Id'
        title:
          type: string
          maxLength: 40
        intro:
          type: [string, 'null']
          maxLength: 100
          description: "공개용 소개 0~100자, 줄바꿈 포함 가능"
        imageUrl:
          type: [string, 'null']
        cityName:
          type: string
        mapProvider:
          type: string
          enum: [KAKAO, GOOGLE]
          description: "지도 제공자 (CITY.MAP_PROVIDER, PUB-04-02)"
        days:
          type: integer
          minimum: 1
          maximum: 7
        authorNickname:
          type: [string, 'null']
        likeCount:
          type: integer
          minimum: 0
        publishedAt:
          $ref: './common.yaml#/components/schemas/LocalDateTime'
        updatedAt:
          oneOf:
            - $ref: './common.yaml#/components/schemas/LocalDateTime'
            - type: 'null'
        viewer:
          $ref: '#/components/schemas/PostViewer'
        schedule:
          type: array
          description: "N일차별 일정 (1일차부터, 방문이 없는 날도 빈 places로 포함)"
          items:
            $ref: '#/components/schemas/PublicDay'

    PostViewer:
      type: object
      description: "보는 사람 기준 표시 값 (PUB-04-03). 비회원이면 모두 false"
      required: [loggedIn, mine, liked, bookmarked, communityWritable]
      properties:
        loggedIn:
          type: boolean
        mine:
          type: boolean
          description: "내 게시물이면 true → [좋아요]·[제목·소개 수정]·[비공개 전환]만 표시"
        liked:
          type: boolean
          description: "내가 좋아요 했는지 (채워진 [좋아요] 버튼)"
        bookmarked:
          type: boolean
          description: "내가 북마크 했는지 (채워진 책갈피)"
        communityWritable:
          type: boolean
          description: "커뮤니티 쓰기 가능 여부. 이용 제한 회원이면 false → 버튼 모두 비활성"

    PublicDay:
      type: object
      required: [dayNo, places]
      properties:
        dayNo:
          type: integer
          minimum: 1
          maximum: 7
          description: "N일차 (실제 날짜는 보내지 않음)"
        places:
          type: array
          description: "방문 순서대로"
          items:
            $ref: '#/components/schemas/PublicPlace'

    PublicPlace:
      type: object
      description: "공개 장소 카드 한 개: \"카페 · 오전 11:45~오후 12:30 · 45분\""
      required: [order, name, category, startTime, endTime, stayMinutes, lodging, lat, lng, segmentToNext]
      properties:
        order:
          type: integer
          minimum: 1
          description: "그날 방문 순서 (지도 핀 번호)"
        name:
          type: string
        category:
          type: [string, 'null']
          description: "카테고리 표시 이름"
        startTime:
          oneOf:
            - $ref: './common.yaml#/components/schemas/HhMm'
            - type: 'null'
        endTime:
          oneOf:
            - $ref: './common.yaml#/components/schemas/HhMm'
            - type: 'null'
        stayMinutes:
          type: [integer, 'null']
          minimum: 0
        lodging:
          type: boolean
          description: "숙소인지"
        lat:
          type: [number, 'null']
          description: "위도. null이면 지도 핀만 빼고 목록에는 표시 (PUB-04-02)"
        lng:
          type: [number, 'null']
        segmentToNext:
          description: "다음 장소까지 구간. 그날 마지막 장소면 null"
          oneOf:
            - $ref: '#/components/schemas/PublicSegment'
            - type: 'null'

    PublicSegment:
      type: object
      description: |
        다음 장소까지 이동 (요금은 보내지 않음). 한 줄 "대중교통 15분(예상) · 3.2km", 이동시간이 없으면 "이동시간 미확인".
        누르면 노선 요약·환승·도보 구간을 펼친다. 임시 모양 — TODO(C와 맞추기, RTE-02-02)
      required: [mode, durationMinutes, estimated, distanceMeters, transitSummary, walkSummary]
      properties:
        mode:
          type: string
          enum: [WALK, TRANSIT, CAR]
          description: "이동수단 (값 목록은 C와 맞추기)"
        durationMinutes:
          type: [integer, 'null']
          minimum: 0
          description: "이동시간(분). null이면 미확인"
        estimated:
          type: boolean
          description: "예상 시간이면 true → \"(예상)\""
        distanceMeters:
          type: [integer, 'null']
          minimum: 0
        transitSummary:
          type: [string, 'null']
          description: "노선·환승 요약 (대중교통일 때)"
        walkSummary:
          type: [string, 'null']
          description: "도보 구간 요약 (대중교통일 때)"

    LikeResponse:
      type: object
      description: "PUB-05 좋아요·취소 결과. 화면은 먼저 바꿔 보여 주고 이 값으로 맞춘다"
      required: [liked, likeCount]
      properties:
        liked:
          type: boolean
        likeCount:
          type: integer
          minimum: 0

    BookmarkResponse:
      type: object
      description: "PUB-06-01 북마크 저장·해제 결과"
      required: [bookmarked]
      properties:
        bookmarked:
          type: boolean

    MyBookmarkResponse:
      type: object
      description: "PUB-06-02 내 북마크 카드 한 개. 볼 수 없게 된 게시물은 visible = false, post = null"
      required: [bookmarkId, postId, visible, post, bookmarkedAt]
      properties:
        bookmarkId:
          $ref: './common.yaml#/components/schemas/Id'
        postId:
          $ref: './common.yaml#/components/schemas/Id'
        visible:
          type: boolean
        post:
          description: "공개 목록 카드와 같은 값. 볼 수 없으면 null"
          oneOf:
            - $ref: '#/components/schemas/PostListResponse'
            - type: 'null'
        bookmarkedAt:
          $ref: './common.yaml#/components/schemas/LocalDateTime'

    PostShareStatusResponse:
      type: object
      description: "PUB-01-01 공유하기 상태. PUB-02-03 내 여행 카드는 PUBLIC만 \"공개\", 나머지는 \"비공개\""
      required: [status, postId, title, intro]
      properties:
        status:
          type: string
          enum: [NONE, PUBLIC, PRIVATE, ADMIN_HIDDEN]
        postId:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
        title:
          type: [string, 'null']
          description: "게시물이 있으면 공개용 제목 (PRIVATE이면 다시 공유할 때 입력 칸에 넣음)"
        intro:
          type: [string, 'null']

    PostCreateRequest:
      type: object
      description: |
        PUB-01-03 게시 입력값. 사진은 아직 받지 않는다.
        - title: 필수 1~40자. 앞뒤 공백 제거, 제어문자는 공백 1칸으로. 비면 POST_TITLE_REQUIRED "공개용 제목을 입력해 주세요."
        - intro: 0~100자, 줄바꿈만 허용(다른 제어문자는 공백 1칸), 비면 null
        - 글자 수는 이모지도 1글자. 넘으면 INVALID_INPUT(화면에서 막는 값)
      required: [requestKey, title]
      properties:
        requestKey:
          $ref: './common.yaml#/components/schemas/RequestKey'
        title:
          type: string
          maxLength: 40
          example: "도쿄 3박 4일 가족여행"
        intro:
          type: [string, 'null']
          maxLength: 100

    PostUpdateRequest:
      type: object
      description: "PUB-02-05 공개용 제목·소개 수정값. 규칙은 PostCreateRequest의 title·intro와 같다"
      required: [title]
      properties:
        title:
          type: string
          maxLength: 40
        intro:
          type: [string, 'null']
          maxLength: 100

    PostPreviewResponse:
      type: object
      description: "PUB-01-02 공개 미리보기. 공개 허용 값만 (제목·소개는 화면이 들고 있음)"
      required: [cityName, mapProvider, days, authorNickname, schedule]
      properties:
        cityName:
          type: [string, 'null']
        mapProvider:
          type: [string, 'null']
          enum: [KAKAO, GOOGLE, null]
        days:
          type: integer
          minimum: 1
          maximum: 7
        authorNickname:
          type: [string, 'null']
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/PublicDay'

    MyPostResponse:
      type: object
      description: "PUB-02-04 내 게시글 카드 한 개: 제목 + \"공개\"/\"비공개\"/\"관리자 비공개\", \"게시 10.20 · 수정 10.28 · 좋아요 12 · 댓글 3\""
      required: [postId, tripId, title, status, publishedAt, updatedAt, likeCount, commentCount, communityWritable]
      properties:
        postId:
          $ref: './common.yaml#/components/schemas/Id'
        tripId:
          $ref: './common.yaml#/components/schemas/Id'
        title:
          type: string
        status:
          type: string
          enum: [PUBLIC, PRIVATE, ADMIN_HIDDEN]
        publishedAt:
          $ref: './common.yaml#/components/schemas/LocalDateTime'
        updatedAt:
          oneOf:
            - $ref: './common.yaml#/components/schemas/LocalDateTime'
            - type: 'null'
        likeCount:
          type: integer
          minimum: 0
        commentCount:
          type: integer
          minimum: 0
        communityWritable:
          type: boolean
          description: "이용 제한 회원이면 false → [비공개 전환]·[공개 전환] 비활성"

    CommentRequest:
      type: object
      description: |
        PUB-08-01·03 댓글 입력값. 1~500자(이모지 1글자), 줄바꿈 허용, 다른 제어문자는 공백 1칸으로, 앞뒤 공백 제거.
        비거나 500자를 넘으면 INVALID_INPUT(화면에서 막는 값). HTML·스크립트는 글자 그대로 저장한다.
      required: [content]
      properties:
        content:
          type: string
          maxLength: 500

    CommentResponse:
      type: object
      description: "PUB-08-02 댓글 한 개: 닉네임 · 내용 · 작성 시각(오른쪽 끝), 고쳤으면 시각 아래 \"수정됨\""
      required: [commentId, content, authorNickname, createdAt, edited, mine]
      properties:
        commentId:
          $ref: './common.yaml#/components/schemas/Id'
        content:
          type: string
          description: "글자 그대로 (화면도 글자로만 표시, 링크 자동 실행 안 함)"
        authorNickname:
          type: [string, 'null']
          description: "TODO(A에 요청): 지금은 null"
        createdAt:
          $ref: './common.yaml#/components/schemas/LocalDateTime'
        edited:
          type: boolean
        mine:
          type: boolean
          description: "로그인 회원 본인 댓글이면 true → [···] [수정] [삭제]"

    CloneCheckResponse:
      type: object
      description: "PUB-07-01 복제 창 위쪽 \"내 여행 n/3\""
      required: [activeTripCount, maxTripCount]
      properties:
        activeTripCount:
          type: integer
          minimum: 0
        maxTripCount:
          type: integer
          example: 3

    CloneRequest:
      type: object
      description: |
        PUB-07-01·02 복제 조건. 종료일·도시·제목은 받지 않는다(공개본 기준으로 서버가 정함).
        여행 인원 1~20 정수(TRP-01-01 규칙·문구 "여행 인원은 1~20 사이의 정수로 입력해 주세요.").
      required: [requestKey, startDate, peopleCount]
      properties:
        requestKey:
          $ref: './common.yaml#/components/schemas/RequestKey'
        startDate:
          $ref: './common.yaml#/components/schemas/LocalDate'
        peopleCount:
          type: integer
          minimum: 1
          maximum: 20
          default: 1

    ReportRequest:
      type: object
      description: |
        PUB-09-01 신고 입력값. 대상은 주소로 정한다.
        - reason: SPAM(스팸·광고) / ABUSE(욕설·괴롭힘) / PRIVACY(개인정보 노출) / NICKNAME(부적절한 닉네임) / ETC(기타, 직접 입력)
        - detail: ETC일 때만 필수 1~300자(이모지 1글자, 줄바꿈 허용, 다른 제어문자는 공백 1칸). 다른 사유면 저장하지 않는다.
        - 비거나 300자를 넘으면 INVALID_INPUT(화면에서 막는 값).
      required: [reason]
      properties:
        reason:
          type: string
          enum: [SPAM, ABUSE, PRIVACY, NICKNAME, ETC]
        detail:
          type: [string, 'null']
          maxLength: 300
