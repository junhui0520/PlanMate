openapi: 3.1.0

info:
  title: "PlanMate 예상 경비 API (D 파트)"
  version: "0.2.0"
  description: |
    예상 경비·환율 API 약속. 기준: 세부기능정의서 v33 BUD-01~04, DB설계서 v7 BUDGET_ITEM.
    - 응답·오류 모양은 `./common.yaml`을 따른다(ApiResponse, ErrorResponse, 공통 응답들).
    - 지금 있는 API: BUD-01-01 경비 목록. 다른 기능은 만들 때 이 파일에 더한다.
    - BUD-03 합계(BudgetSummaryResponse)는 응답 모양만 정해 두었다. 주소(GET /api/trips/{tripId}/budget-summary 예정)는
      여행 인원(B의 TripService)과 로그인(A의 pjh/security)이 생긴 뒤 연다.
    - BUD-01-02 추가(BudgetItemRequest → BudgetItemResponse)도 요청 모양만 정해 두었다.
      주소(POST /api/trips/{tripId}/budget-items 예정)는 로그인(A의 pjh/security)이 생긴 뒤 연다.
    - BUD-01-04 수정·삭제도 로그인이 생긴 뒤 연다. 예정 주소와 규칙:
      - 수정 PUT /api/trips/{tripId}/budget-items/{itemId}: 요청은 BudgetItemRequest(scope는 원래 값과 같아야 함), 응답은 BudgetItemResponse
      - 삭제 DELETE /api/trips/{tripId}/budget-items/{itemId}: 응답 data는 null
      - 입력 규칙은 추가와 같고 개수 제한은 보지 않는다. 동시 수정은 나중에 저장한 값으로 덮어쓴다(버전 칸 없음).
      - 없거나 다른 여행의 항목이면 BUDGET_ITEM_NOT_FOUND(404) "이미 삭제된 경비예요."
      - 공통은 소유자·편집 참여자, 개인은 주인 본인만. 아니면 BUDGET_EDIT_FORBIDDEN(403) "이 경비를 고칠 권한이 없어요."
      - 교통비로 반영된 항목(ROUTE_FARE)도 고치거나 지울 수 있고, 고쳐도 amountSource는 그대로다.
        지우면 구간 연결 기록(FARE_EXPENSE_LINK)은 DB가 함께 지운다.
    - BUD-02-03 펼친 칸 메모도 로그인이 생긴 뒤 연다. 예정 주소와 규칙:
      - 메모 PATCH /api/trips/{tripId}/budget-items/{itemId}/memo: 요청 {memo: string|null}, 응답은 BudgetItemResponse
      - 공통 경비만(개인 경비면 INVALID_INPUT), 0~200자·앞뒤 공백 제거·제어문자 불가, 비우면 삭제(memo null)
      - 소유자·편집 참여자만. 아니면 BUDGET_EDIT_FORBIDDEN(403), 없으면 BUDGET_ITEM_NOT_FOUND(404)
      - 교통비 항목의 출처·확인 시점은 C 파트(FareService) 데이터라 아직 응답에 없다. TODO(C와 응답 모양 맞추기)
    - 경비 목록은 경비 탭이 쓰는 여행 정보를 함께 준다(BudgetListResponse): 여행 통화·인원·일수(B의 TripService.findBasicInfo),
      내 회원 ID·내 역할(A의 TripAccessChecker). 여행 통화는 여행 도시의 나라 코드를 D가 통화로 바꾼다
      (자바 나라별 통화, 은행 표기와 다른 중국은 CNH, 알 수 없으면 KRW).
      참여자 닉네임(participants)은 A의 ParticipantService·MemberService가 생기면 채운다(지금은 빈 배열).

servers:
  - url: http://localhost:8080
    description: "로컬 개발"

paths:
  /api/trips/{tripId}/budget-items:
    get:
      summary: "BUD-01-01 경비 목록 조회"
      description: |
        여행의 공통·개인 경비 항목을 모두 돌려준다(개인 경비도 모든 참여자가 볼 수 있음).
        정렬은 추가한 순서(itemId 오름차순). 분류별 묶기·탭은 화면이 한다.
        경비 탭이 쓰는 여행 정보(통화·인원·일수·내 역할)도 함께 준다.
        권한: 로그인 + 이 여행의 참여자(소유자·편집 참여자·조회 참여자) + 여행이 휴지통이 아님 (TripAccessChecker).
      tags: [budget]
      parameters:
        - name: tripId
          in: path
          required: true
          description: "여행 ID"
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: "경비 목록 + 여행 정보 (항목이 없으면 items가 빈 배열)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BudgetListResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

components:
  schemas:
    BudgetListResponse:
      type: object
      description: "BUD-01-01 경비 탭 목록. 경비 항목과 화면이 쓰는 여행 정보"
      required: [tripId, tripCurrency, memberCount, tripDays, myMemberId, myRole, participants, items]
      properties:
        tripId:
          $ref: './common.yaml#/components/schemas/Id'
        tripCurrency:
          type: string
          description: "여행 도시 통화 (BUD-01-02 통화 기본값). KRW면 국내 여행이라 환율 위젯을 숨긴다"
          example: "JPY"
        memberCount:
          type: integer
          minimum: 1
          description: "여행 인원 (TRIP.PEOPLE_COUNT, 참여자 수와 별개). 1인당 금액·내 1인 경비 계산에 쓴다"
        tripDays:
          type: integer
          minimum: 1
          maximum: 7
          description: "여행 일수 (시작일~종료일). BUD-02-01 일수 기본값"
        myMemberId:
          $ref: './common.yaml#/components/schemas/Id'
        myRole:
          type: string
          enum: [OWNER, EDITOR, VIEWER]
          description: "내 여행 역할. VIEWER면 공통·개인 모두 입력 불가"
        participants:
          type: array
          description: "참여자 닉네임 (개인 경비 카드 제목). TODO(A에 요청): 지금은 빈 배열"
          items:
            type: object
            required: [memberId, nickname]
            properties:
              memberId:
                $ref: './common.yaml#/components/schemas/Id'
              nickname:
                type: string
        items:
          type: array
          description: "경비 항목 (추가한 순서)"
          items:
            $ref: '#/components/schemas/BudgetItemResponse'

    BudgetItemResponse:
      type: object
      description: "경비 항목 한 줄 (BUDGET_ITEM)"
      required: [itemId, scope, category, name, calcType, amount, currency, amountSource, calcNote, estimateBasis, memo, createdBy]
      properties:
        itemId:
          $ref: './common.yaml#/components/schemas/Id'
        scope:
          type: string
          description: "경비 구분"
          enum: [COMMON, PERSONAL]
        category:
          type: string
          description: "분류 (교통 / 숙박 / 식비 / 관광 / 기타)"
          enum: [TRANSPORT, LODGING, FOOD, SIGHTSEEING, ETC]
        name:
          type: string
          description: "항목명 1~50자"
        calcType:
          type: [string, "null"]
          description: "계산 방식. 공통 경비만 있고 개인 경비는 null"
          enum: [TOTAL, PER_PERSON, null]
        amount:
          type: [number, "null"]
          description: "금액(원통화). 가격 확인 전이면 null (0과 다름)"
        currency:
          type: string
          description: "통화 코드 3자리"
        amountSource:
          type: string
          description: "금액 입력 방식 (직접 입력 / 예산 기준 계산 / 교통비 반영)"
          enum: [MANUAL, BUDGET_RULE, ROUTE_FARE]
        calcNote:
          type: [string, "null"]
          description: "BUD-02-03 금액 계산 설명 (CALC_NOTE). 없으면 null"
        estimateBasis:
          type: [string, "null"]
          description: "BUD-02-03 자동 계산 기준값 (ESTIMATE_BASIS, 예산 기준 계산 항목). 없으면 null"
        memo:
          type: [string, "null"]
          description: "메모 0~200자 (공통 경비만)"
        createdBy:
          type: [integer, "null"]
          format: int64
          description: "만든 회원 ID (개인 경비면 그 경비 주인)"
      examples:
        - itemId: 2
          scope: COMMON
          category: LODGING
          name: "숙소"
          calcType: TOTAL
          amount: 40000
          currency: JPY
          amountSource: MANUAL
          calcNote: null
          estimateBasis: null
          memo: "3박, 조식 포함"
          createdBy: 1

    # ---- BUD-01-02 경비 항목 추가 ----
    BudgetItemRequest:
      type: object
      description: |
        경비 항목 추가 입력값. 만든 사람은 보내지 않는다(서버가 로그인 정보로 채움).
        서버도 화면과 같은 규칙으로 다시 검사한다. 오류 응답은 common.yaml ErrorResponse 모양.
        - 항목명이 비면 BUDGET_NAME_REQUIRED "항목명을 입력해 주세요."
        - 금액도 '가격 확인 전'도 없으면 BUDGET_AMOUNT_REQUIRED "금액을 입력하거나 '가격 확인 전'을 선택해 주세요."
        - 금액이 음수면 BUDGET_AMOUNT_NEGATIVE "0 이상으로 입력해 주세요."
        - 공통 경비가 여행에 200개면 BUDGET_COMMON_LIMIT, 내 개인 경비가 200개면 BUDGET_PERSONAL_LIMIT
        - 조회 참여자가 공통 경비를 추가하면 BUDGET_COMMON_EDIT_FORBIDDEN, 개인 경비면 EDIT_PERMISSION_CHANGED
        - 그 밖에 화면이 먼저 막는 값(글자 수 초과, 제어문자, 통화 자릿수 초과, 원화 기준 1억 초과,
          환율 없는 통화, 개인 경비의 메모·계산 방식, 금액과 priceUnknown을 함께 보냄)은 INVALID_INPUT
        - BUD-02-01 예산 기준 계산(budgetRule)이면 금액은 서버가 계산한다(amount는 null, 공통·TOTAL만, 추가에서만).
          기준 금액이 없으면 BUDGET_BASE_AMOUNT_REQUIRED "기준 금액을 입력해 주세요."
          저장된 항목은 amountSource BUDGET_RULE, calcNote "30,000원 × 4명 × 3일 = 360,000원",
          estimateBasis {"baseAmount":30000,"currency":"KRW","people":4,"days":3,"times":null}
      required: [scope, category, name, priceUnknown, currency]
      properties:
        scope:
          type: string
          description: "누른 버튼으로 정해짐 (공통 / 내 개인)"
          enum: [COMMON, PERSONAL]
        category:
          type: string
          enum: [TRANSPORT, LODGING, FOOD, SIGHTSEEING, ETC]
        name:
          type: string
          description: "앞뒤 공백 제거 후 1~50자 (코드 포인트, 이모지 1자), 제어문자 불가"
          example: 저녁 식사
        calcType:
          type: [string, "null"]
          description: "공통 경비면 꼭 채움, 개인 경비면 null"
          enum: [TOTAL, PER_PERSON, null]
        amount:
          type: [number, "null"]
          description: "0 이상, 원화 기준 1억 이하, 통화 표준 자릿수까지(엔·원 정수, 달러·유로 소수 2자리). priceUnknown이면 null"
          example: 30000
        priceUnknown:
          type: boolean
          description: "'가격 확인 전' 선택. true면 amount는 null (0원으로 저장하지 않음)"
          example: false
        currency:
          type: string
          description: "원화 또는 오늘 환율이 있는 통화 (기본값은 여행 도시 통화, 화면이 채움)"
          example: KRW
        memo:
          type: [string, "null"]
          description: "공통 경비만 0~200자, 제어문자 불가"
        budgetRule:
          description: "BUD-02-01 예산 기준 계산으로 넣을 때만. 기준 금액 x 선택한 값들(곱할 값이 없으면 기준 금액 그대로)"
          oneOf:
            - type: "null"
            - type: object
              required: [baseAmount, multiplyPeople]
              properties:
                baseAmount:
                  type: [number, "null"]
                  description: "기준 금액 (필수, 0 이상, 통화 표준 자릿수까지)"
                  example: 30000
                multiplyPeople:
                  type: boolean
                  description: "x 여행 인원 (인원은 여행 정보에서 자동)"
                days:
                  type: [integer, "null"]
                  description: "x 일수 1~7 (안 곱하면 null)"
                  example: 3
                times:
                  type: [integer, "null"]
                  description: "x 횟수 1~99 (안 곱하면 null)"

    # ---- BUD-03 경비 합계 (계산은 서버에서만) ----
    BudgetSummaryResponse:
      type: object
      description: "BUD-03-01 공통 경비 합계 + BUD-03-03 내 1인 경비 (+ BUD-03-04 부분 합계, BUD-04-02 원화 합산)"
      required: [tripId, commonTotal, myShare]
      properties:
        tripId:
          $ref: './common.yaml#/components/schemas/Id'
        commonTotal:
          $ref: '#/components/schemas/BudgetTotal'
        myShare:
          $ref: '#/components/schemas/MyShareTotal'

    CurrencyAmount:
      type: object
      description: "통화 하나의 합계. 통화 표준 자릿수로 마지막에 한 번 반올림(엔·원 0자리, 달러·유로 2자리)"
      required: [currency, amount]
      properties:
        currency:
          type: string
          example: JPY
        amount:
          type: number
          example: 41600

    ExcludedItem:
      type: object
      description: "BUD-03-04 계산에서 빠진 항목. PRICE_UNKNOWN은 통화별·원화 합산 모두, NO_RATE는 원화 합산에서만 빠짐"
      required: [itemId, name, reason]
      properties:
        itemId:
          $ref: './common.yaml#/components/schemas/Id'
        name:
          type: string
          example: 입장권
        reason:
          type: string
          enum: [PRICE_UNKNOWN, NO_RATE]

    BudgetTotal:
      type: object
      required: [krwTotal, byCurrency, excluded]
      properties:
        krwTotal:
          type: integer
          format: int64
          description: "원화 합산(원 단위, 마지막에 한 번 반올림). 환율 없는 통화는 빠짐"
          example: 498560
        byCurrency:
          type: array
          description: "통화별 합계 (원화는 맨 뒤)"
          items:
            $ref: '#/components/schemas/CurrencyAmount'
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedItem'

    MyShareTotal:
      description: "BUD-03-03 내 1인 경비 = 공통 경비 합계 / 여행 인원 + 내 개인 경비 (통화별)"
      allOf:
        - $ref: '#/components/schemas/BudgetTotal'
        - type: object
          required: [commonShare, personal]
          properties:
            commonShare:
              type: array
              description: "공통 경비 몫 (공통 경비 합계 / 여행 인원)"
              items:
                $ref: '#/components/schemas/CurrencyAmount'
            personal:
              type: array
              description: "내 개인 경비 합계"
              items:
                $ref: '#/components/schemas/CurrencyAmount'
