openapi: 3.0.3
info:
  title: PlanMate 예상 경비 API (D 파트)
  version: 0.1.0
  description: |
    예상 경비·환율 API 약속. 기준: 세부기능정의서 v33 BUD-01~04, DB설계서 v7 BUDGET_ITEM.
    - 모든 응답은 공통 응답 모양 {success, data, message} 로 감싼다.
      (TODO(공통): contracts/common.yaml 이 생기면 ApiResponse 정의를 거기서 가져온다)
    - 지금 있는 API: BUD-01-01 경비 목록. 다른 기능은 만들 때 이 파일에 더한다.
    - 여행 인원·참여자 닉네임·내 역할·여행 통화는 경비 API가 주지 않는다(A·B 파트 데이터).

paths:
  /api/trips/{tripId}/budget-items:
    get:
      summary: BUD-01-01 경비 목록 조회
      description: |
        여행의 공통·개인 경비 항목을 모두 돌려준다(개인 경비도 모든 참여자가 볼 수 있음).
        정렬은 추가한 순서(itemId 오름차순). 분류별 묶기·탭은 화면이 한다.
        권한: 로그인 + 이 여행의 참여자(소유자·편집 참여자·조회 참여자) + 여행이 휴지통이 아님.
      tags: [budget]
      parameters:
        - name: tripId
          in: path
          required: true
          description: 여행 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 경비 목록 (항목이 없으면 빈 배열)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BudgetItemResponse'
                  message:
                    type: string
                    nullable: true
                    example: null
        '401':
          description: 로그인 필요
        '403':
          description: 이 여행의 참여자가 아니거나 휴지통 여행

components:
  schemas:
    BudgetItemResponse:
      type: object
      description: 경비 항목 한 줄 (BUDGET_ITEM)
      required: [itemId, scope, category, name, currency, amountSource]
      properties:
        itemId:
          type: integer
          format: int64
          example: 2
        scope:
          type: string
          description: 경비 구분
          enum: [COMMON, PERSONAL]
          example: COMMON
        category:
          type: string
          description: 분류 (교통 / 숙박 / 식비 / 관광 / 기타)
          enum: [TRANSPORT, LODGING, FOOD, SIGHTSEEING, ETC]
          example: LODGING
        name:
          type: string
          description: 항목명 1~50자
          example: 숙소
        calcType:
          type: string
          nullable: true
          description: 계산 방식. 공통 경비만 있고 개인 경비는 null
          enum: [TOTAL, PER_PERSON]
          example: TOTAL
        amount:
          type: number
          nullable: true
          description: 금액(원통화). 가격 확인 전이면 null (0과 다름)
          example: 40000
        currency:
          type: string
          description: 통화 코드 3자리
          example: JPY
        amountSource:
          type: string
          description: 금액 입력 방식 (직접 입력 / 예산 기준 계산 / 교통비 반영)
          enum: [MANUAL, BUDGET_RULE, ROUTE_FARE]
          example: MANUAL
        memo:
          type: string
          nullable: true
          description: 메모 0~200자 (공통 경비만)
          example: 3박, 조식 포함
        createdBy:
          type: integer
          format: int64
          nullable: true
          description: 만든 회원 ID (개인 경비면 그 경비 주인)
          example: 1
