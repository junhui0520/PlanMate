openapi: 3.1.0

info:
  title: "PlanMate 예상 경비 API (D 파트)"
  version: "0.2.0"
  description: |
    예상 경비·환율 API 약속. 기준: 세부기능정의서 v33 BUD-01~04, DB설계서 v7 BUDGET_ITEM.
    - 응답·오류 모양은 `./common.yaml`을 따른다(ApiResponse, ErrorResponse, 공통 응답들).
    - 지금 있는 API: BUD-01-01 경비 목록. 다른 기능은 만들 때 이 파일에 더한다.
    - BUD-03 합계(BudgetSummaryResponse)는 응답 모양만 정해 두었다. 주소(GET /api/trips/{tripId}/budget-summary 예정)는
      여행 인원(B의 TripService)과 로그인(A의 pjh/security)이 생긴 뒤 연다.
    - 여행 인원·참여자 닉네임·내 역할·여행 통화는 경비 API가 주지 않는다(A·B 파트 데이터).

servers:
  - url: http://localhost:8080
    description: "로컬 개발"

paths:
  /api/trips/{tripId}/budget-items:
    get:
      summary: "BUD-01-01 경비 목록 조회"
      description: |
        여행의 공통·개인 경비 항목을 모두 돌려준다(개인 경비도 모든 참여자가 볼 수 있음).
        정렬은 추가한 순서(itemId 오름차순). 분류별 묶기·탭은 화면이 한다.
        권한: 로그인 + 이 여행의 참여자(소유자·편집 참여자·조회 참여자) + 여행이 휴지통이 아님.
        (권한 검사는 pjh/security의 TripAccessChecker가 생기면 적용)
      tags: [budget]
      parameters:
        - name: tripId
          in: path
          required: true
          description: "여행 ID"
          schema:
            $ref: './common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: "경비 목록 (항목이 없으면 빈 배열)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BudgetItemResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalServerError'

components:
  schemas:
    BudgetItemResponse:
      type: object
      description: "경비 항목 한 줄 (BUDGET_ITEM)"
      required: [itemId, scope, category, name, calcType, amount, currency, amountSource, memo, createdBy]
      properties:
        itemId:
          $ref: './common.yaml#/components/schemas/Id'
        scope:
          type: string
          description: "경비 구분"
          enum: [COMMON, PERSONAL]
        category:
          type: string
          description: "분류 (교통 / 숙박 / 식비 / 관광 / 기타)"
          enum: [TRANSPORT, LODGING, FOOD, SIGHTSEEING, ETC]
        name:
          type: string
          description: "항목명 1~50자"
        calcType:
          type: [string, "null"]
          description: "계산 방식. 공통 경비만 있고 개인 경비는 null"
          enum: [TOTAL, PER_PERSON, null]
        amount:
          type: [number, "null"]
          description: "금액(원통화). 가격 확인 전이면 null (0과 다름)"
        currency:
          type: string
          description: "통화 코드 3자리"
        amountSource:
          type: string
          description: "금액 입력 방식 (직접 입력 / 예산 기준 계산 / 교통비 반영)"
          enum: [MANUAL, BUDGET_RULE, ROUTE_FARE]
        memo:
          type: [string, "null"]
          description: "메모 0~200자 (공통 경비만)"
        createdBy:
          type: [integer, "null"]
          format: int64
          description: "만든 회원 ID (개인 경비면 그 경비 주인)"
      examples:
        - itemId: 2
          scope: COMMON
          category: LODGING
          name: "숙소"
          calcType: TOTAL
          amount: 40000
          currency: JPY
          amountSource: MANUAL
          memo: "3박, 조식 포함"
          createdBy: 1

    # ---- BUD-03 경비 합계 (계산은 서버에서만) ----
    BudgetSummaryResponse:
      type: object
      description: "BUD-03-01 공통 경비 합계 + BUD-03-03 내 1인 경비 (+ BUD-03-04 부분 합계, BUD-04-02 원화 합산)"
      required: [tripId, commonTotal, myShare]
      properties:
        tripId:
          $ref: './common.yaml#/components/schemas/Id'
        commonTotal:
          $ref: '#/components/schemas/BudgetTotal'
        myShare:
          $ref: '#/components/schemas/MyShareTotal'

    CurrencyAmount:
      type: object
      description: "통화 하나의 합계. 통화 표준 자릿수로 마지막에 한 번 반올림(엔·원 0자리, 달러·유로 2자리)"
      required: [currency, amount]
      properties:
        currency:
          type: string
          example: JPY
        amount:
          type: number
          example: 41600

    ExcludedItem:
      type: object
      description: "BUD-03-04 계산에서 빠진 항목. PRICE_UNKNOWN은 통화별·원화 합산 모두, NO_RATE는 원화 합산에서만 빠짐"
      required: [itemId, name, reason]
      properties:
        itemId:
          $ref: './common.yaml#/components/schemas/Id'
        name:
          type: string
          example: 입장권
        reason:
          type: string
          enum: [PRICE_UNKNOWN, NO_RATE]

    BudgetTotal:
      type: object
      required: [krwTotal, byCurrency, excluded]
      properties:
        krwTotal:
          type: integer
          format: int64
          description: "원화 합산(원 단위, 마지막에 한 번 반올림). 환율 없는 통화는 빠짐"
          example: 498560
        byCurrency:
          type: array
          description: "통화별 합계 (원화는 맨 뒤)"
          items:
            $ref: '#/components/schemas/CurrencyAmount'
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedItem'

    MyShareTotal:
      description: "BUD-03-03 내 1인 경비 = 공통 경비 합계 / 여행 인원 + 내 개인 경비 (통화별)"
      allOf:
        - $ref: '#/components/schemas/BudgetTotal'
        - type: object
          required: [commonShare, personal]
          properties:
            commonShare:
              type: array
              description: "공통 경비 몫 (공통 경비 합계 / 여행 인원)"
              items:
                $ref: '#/components/schemas/CurrencyAmount'
            personal:
              type: array
              description: "내 개인 경비 합계"
              items:
                $ref: '#/components/schemas/CurrencyAmount'
