spring:
  application:
    name: PlanMate
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration   # 로그인은 pjh/login에서 PasswordEncoder로 직접 확인(기본 사용자 불필요)
  datasource:                     # 값은 환경변수 또는 application-local.yml(local 프로필)에서 덮어씀
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none              # 테이블은 schema.sql로만 만든다 (AGENTS §6)
    open-in-view: false
  sql:
    init:
      mode: never                 # schema.sql 자동 실행 방지
  session:
    jdbc:
      initialize-schema: never    # SPRING_SESSION 테이블은 schema.sql로 이미 만들어 둠
      table-name: SPRING_SESSION
  mail:                           # 인증번호 메일 (ACC-01-02·ACC-04-02). 값은 환경변수 또는 application-local.yml
    host: ${MAIL_HOST:}           # 비어 있으면 연결하지 않고 발송 실패(502)로 처리
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  servlet:
    session:
      timeout: 60m                # ACC-07 일반 회원 무활동 60분 (관리자 15분·최대 시간은 pjh/security에서)
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}   # 로컬 HTTP 테스트는 false, 운영 배포 시 true
        same-site: lax

planmate:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  auth:
    email-verification-hmac-secret: ${EMAIL_VERIFICATION_HMAC_SECRET}   # 인증번호 HMAC 비밀키 (A-P09). 기본값 없음, 없으면 시작 실패
